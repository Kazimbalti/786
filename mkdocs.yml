# git add .
# git commit -m $'Modified new version of files'
# git push origin main
site_name: Dr Muhammad Kazim
site_url: https://kazimbalti.github.io/786/
theme:
  name: material
  features:
  - navigation.tabs
  - navigation.sections
  - toc.integrate
  - navigation.top
  - search.suggest
  - search.highlight
  - content.tabs.link
  - content.code.annotation
  - content.code.copy
  language: en
  palette:
  - scheme: default
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
    primary: teal
    accent: purple
  - scheme: slate
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode
    primary: teal
    accent: lime
    
extra_javascript:
  - js/open-new-tab.js

extra:
  social:
  - icon: fontawesome/brands/github-alt
    link: https://github.com/Kazimbalti
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/in/muhammad-kazim-1651b3132/
markdown_extensions:
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- admonition
- pymdownx.arithmatex:
    generic: true
- footnotes
- pymdownx.details
- pymdownx.superfences
- pymdownx.mark
- attr_list
copyright: '&copy; 2024 <a href="https://github.com/kazimbalti"  target="_blank" rel="noopener">Dr.
  Muhammad Kazim</a>'
nav:
- Welcome: index.md
- Unmanned Ground Vehicles (UGVs):
  - Scout Mini: page2.md
  - Scout_Hunter: Page3.md
  - F1Tenth: Page4.md
  - Turtlebot3: page5.md
  - Turtlebot4: Page6.md
  - Self Driving Car: Page7.md
  - Delivery Robot: page8.md
- Unmanned Aerial Vehicles (UAVs):
  - Autonomous Drone: page9.md
  - Crazyflie2.1 and Starling2: page10.md
- Robotics:
  - Linux & Docker: page11.md